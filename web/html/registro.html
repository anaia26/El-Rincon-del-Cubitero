<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../css/estilos.css">
</head>
<div id="registro">
<body>
    <header>
        <a href="index.html"><img src="../img/logoTienda.png" alt="Logo Tienda"/></a>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="registro.html" class="enlace">Registro</a></li>
        </ul>
    </nav>
    <main>
        <form action="mailto:anaiglesiasarias01@liceolapaz.net" method="post" enctype="text/plain">
            <table border="0">
                <tr style="padding-top:10px;">
                    <td style="text-align:right;padding-right:10px;padding-top:20px;"><label for="usuario">Usuario <span class="rojo">* </span>: </label></td>
                    <td style="text-align:left;padding-left:10px;padding-top:20px;"><input type="text" name="usuario" id="usuario" size="30" maxlength="20" tabindex="1" required/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="passwd">Contraseña <span class="rojo">* </span>: </label></td>
                        <td class="columnaDerecha"><input type="password" name="contraseña" id="passwd" size="30" minlength="6" maxlength="10" tabindex="2" required/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="correo">Correo electrónico <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><input type="email" name="email" id="correo" size="30" maxlength="75" tabindex="3" placeholder="Ej: nombre@email.com" required /></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="nombre">Nombre <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><input type="text" name="nombre" id="nombre" size="30" maxlength="20" tabindex="4" required/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="apellido1">Primer Apellido <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><input type="text" name="apellido1" id="apellido1" size="30" maxlength="30" tabindex="5" required/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="apellido2">Segundo Apellido : </label></td>
                    <td class="columnaDerecha"><input type="text" name="apellido2" id="apellido2" size="30" maxlength="30" tabindex="6"/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="fecha">Fecha de Nacimiento <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><input type="date" name="fecha" id="fecha" size="30" tabindex="7" required/></td>
                </tr>
                <tr>
                    <td class="columnaIzquierda"><label for="telefono">Teléfono móvil <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><input type="tel" name="telefono" id="telefono" size="30" maxlength="9" tabindex="8" pattern="[6]{1}[0-9]{8}" placeholder="Ej: 612345789" required></td>
                </tr>
                <tr valign="top">
                    <td class="columnaIzquierda"><label for="motivoContacto">Motivo por el que quiere contactarnos <span class="rojo">* </span>: </label></td>
                    <td class="columnaDerecha"><textarea name="motivoContacto" id="motivoContacto" cols="30" rows="10" tabindex="9" required></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;padding-left:0px;padding-top:10px;padding-bottom:20px"><span class="rojo">* </span>Indica un campo obligatorio<br/><br/><input type="submit" value="Registrarse" tabindex="10"/><input type="reset" value="Borrar datos"/></td>
                </tr>
        </table>
        </form>
    </main>
    <footer>
        <p id="parrafo1Footer">Página web hecha por Ana Iglesias y Diego Coello.</p>
        <p>&copy; 2025. Todos los derechos reservados</p>
    </footer>
</body>
</div>
</html>
