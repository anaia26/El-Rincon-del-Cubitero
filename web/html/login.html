<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón del Cubitero</title>
    <link rel="icon" type="image/webp" href="../img/logo_pestanha.webp">
    <link rel="logo web" href="../img/logo_pestanha.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <!-- Menu Section-->
        <nav id="navegador" class="navbar navbar-expand-md">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <a title="Imagen Logo" href="../html/index.html"><img src="../img/logo_pestanha.webp" alt="Logo de la tienda"
                            id="logoTiendaHeader" class="ms-4 my-2"></a>
                    <p class="text-white mt-3 ms-4"><a title="El Rincón del Cubitero" href="../html/index.html"
                            id="enlaceNombreTiendaHeader">El Rincón del Cubitero</a></p>
                </div>
                <div class="d-flex justify-content-center ms-4">
                    <button class="navbar-toggler me-1" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse me-3" id="navbarNav">
                        <ul class="navbar-nav d-flex justify-content-center">
                            <li class="nav-item mx-3">
                                <a title="Inicio" class="nav-link active" aria-current="page"
                                    href="../html/index.html">Inicio</a>
                            </li>
                            <li class="nav-item mx-3">
                                <a title="Productos" class="nav-link active" aria-current="page"
                                    href="../html/productos.html">Productos</a>
                            </li>
                            <li class="nav-item mx-3">
                                <a title="Contacto" class="nav-link active" href="../html/contacto.html">Contacto</a>
                            </li>
                            <li class="nav-item mx-3">
                                <a title="Registro" class="nav-link active" href="../html/registro.html">Registro</a>
                            </li>
                            <li class="nav-item mx-3 active">
                                <a title="Login" class="nav-link active" href="../html/login.html">Login</a>
                            </li>
                            <li class="nav-item">
                                <a title="Carrito" href="../html/login.html"><img src="../img/carro-de-la-compra.webp"
                                        alt="Logo de carrito" id="logoCarritoHeader" class="ms-3 my-1"></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <div class="container d-flex justify-content-start pt-4 pb-4 mt-4">
        <nav aria-label="breadcrumb row">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a title="Inicio" aria-label="Inicio" href="../html/index.html" class="enlaceLila"><i class="bi bi-house-door-fill"></i></a></li>
                <li class="breadcrumb-item active text-decoration-underline" aria-current="page">Login</li>
            </ol>
        </nav>
    </div>
    <main>
        <div class="py-5">
            <div class="container mb-5">
                <div class="form-container p-4">
                    <h1 class="text-center mb-4">Login</h1>
                    <form>
                        <!-- Usuario -->
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="usuario" required data-bs-toggle="tooltip"
                                data-bs-placement="top" title="Usuario">
                        </div>
                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasena" required
                                data-bs-toggle="tooltip" data-bs-placement="top" title="Contraseña">
                        </div>
                        <!-- Botón de registro -->
                        <div class="d-grid">
                            <button title="Iniciar sesión" type="submit" class="btn">Iniciar Sesión</button>
                        </div>
                        <p class="mt-4 text-center">¿No tienes cuenta?
                            <a title="Ir a Registro" id="registrateAqui" aria-label="Ir a Registro" href="../html/registro.html">¡Regístrate aquí!</a>
                        </p>
                        <p class="text-center">¿No recuerdas tu contraseña?
                            <a title="Ir a Recuperar contraseña" href="mailto:info@elrincondelcubitero.com" id="recuperarContraseña" aria-label="Ir a Recuperar contraseña" href="../html/registro.html">Recuperar Contraseña</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer" class="d-flex justify-content-center flex-column align-items-center mt-1">

        <p class="text-center text-white m-2">&copy; 2025. Todos los derechos reservados.</p>
        <div class="d-flex flex-row gap-4 align-items-center">
            <div class="m-2">
                <a href="https://www.facebook.com/?locale=es_ES" target="_blank" rel="noopener"
                    class="me-2 mb-3 text-white fs-4 text-decoration-none" data-bs-toggle="tooltip"
                    data-bs-placement="top" title="Ir a Facebook">
                    <i title="Facebook" class="bi bi-facebook"></i>
                </a>
                <a href="https://twitter.com/" target="_blank" rel="noopener"
                    class="me-2 mb-3 text-white fs-4 text-decoration-none" data-bs-toggle="tooltip"
                    data-bs-placement="top" title="Ir a Twitter">
                    <i title="Twitter" class="bi bi-twitter"></i>
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener"
                    class="mb-3 text-white fs-4 text-decoration-none" data-bs-toggle="tooltip" data-bs-placement="top"
                    title="Ir a Instagram">
                    <i title="Instagram" class="bi bi-instagram"></i>
                </a>
            </div>
            <p class="mb-1"><a title="Mapa web" href="../html/mapa_web.html" class="text-white" id="enlaceMapaWeb">Mapa web</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

</html>
